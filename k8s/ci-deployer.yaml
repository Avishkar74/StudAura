# Identity used by the GitHub Actions deploy job. It holds no AWS credentials: it is a Kubernetes
# ServiceAccount whose token is stored as a GitHub secret, and it can touch only the studaura
# namespace (Helm keeps its release records as Secrets in the namespace, hence the secrets rule).
# Apply once with `kubectl apply -f k8s/ci-deployer.yaml`; see docs/CICD.md for storing the token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-deployer
  namespace: studaura
---
apiVersion: v1
kind: Secret
metadata:
  name: ci-deployer-token
  namespace: studaura
  annotations:
    kubernetes.io/service-account.name: ci-deployer
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-deployer
  namespace: studaura
rules:
  - apiGroups: [""]
    resources: [configmaps, secrets, services, serviceaccounts, pods, pods/log, events]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [monitoring.coreos.com]
    resources: [servicemonitors, prometheusrules]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-deployer
  namespace: studaura
subjects:
  - kind: ServiceAccount
    name: ci-deployer
    namespace: studaura
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ci-deployer
