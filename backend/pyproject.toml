[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studaura-backend"
version = "0.1.0"
description = "StudAura FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    # Starlette 1.3.1 fixes CVE-2026-48818 and CVE-2026-54283 (HIGH). The old instrumentator 7.x
    # pinned Starlette below 1.0; 8.x supports it, so the FastAPI cap is gone.
    "fastapi>=0.136,<1",
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.32,<1",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "pydantic-settings>=2.6,<3",
    "python-jose[cryptography]>=3.3,<4",
    "httpx>=0.27,<1",
    "nh3>=0.2.18,<1",
    "prometheus-client>=0.21,<1",
    "tzdata>=2024.1",
    "prometheus-fastapi-instrumentator>=8.1,<9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
# Generated migrations are exempt from style checks.
extend-exclude = ["build", "alembic/versions"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["jose.*", "prometheus_fastapi_instrumentator.*", "asyncpg.*"]
ignore_missing_imports = true
