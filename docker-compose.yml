name: studaura

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: studaura
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d studaura"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot migration step; runs once per `up`, never inside the app replicas.
  migrate:
    build:
      context: ./backend
      target: dev
    command: ["alembic", "upgrade", "head"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/studaura
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      target: dev
    env_file:
      - path: .env
        required: false
    environment:
      # Local Postgres always wins over the Supabase URL in .env.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/studaura
      APP_ENV: local
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./backend/alembic:/app/alembic
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      target: dev
    env_file:
      - path: .env
        required: false
    environment:
      # Browser-side URL of the backend (the browser, not the container, makes the calls).
      VITE_API_BASE_URL: http://localhost:8000
      VITE_USE_POLLING: "true"
    ports:
      - "5173:5173"
      - "3000:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
    depends_on:
      - backend

volumes:
  db_data:
