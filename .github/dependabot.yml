# Keeps the pinned GitHub Actions (pinned to commit SHAs), dependencies and base images current.
# Each update arrives as a pull request, so it goes through the same CI gates as any change.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend:
        update-types: [minor, patch]
    ignore:
      # pyproject.toml caps FastAPI below 0.143 on purpose: prometheus-fastapi-instrumentator
      # breaks on newer releases. Lift this together with the cap once that is fixed upstream.
      - dependency-name: fastapi
        versions: [">=0.143"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    # A package belongs to the first group that matches it, so the coupled sets come first and
    # each arrives as ONE pull request. The catch-all group is last.
    groups:
      # react, react-dom and their type packages must stay on the same major. Proposed apart, the
      # types and the runtime disagree and CI fails (e.g. @types/react 19 with @types/react-dom 18).
      react:
        patterns: [react, react-dom, "@types/react", "@types/react-dom"]
      tiptap:
        patterns: ["@tiptap/*"]
      tailwind:
        patterns: [tailwindcss, "@tailwindcss/*"]
      eslint:
        patterns: [eslint, "@eslint/*", "eslint-plugin-*", typescript-eslint, globals]
      testing:
        patterns: [vitest, jsdom, "@testing-library/*"]
      frontend:
        update-types: [minor, patch]
    ignore:
      # The app is on React 18 and is tested there. Moving to React 19 is a deliberate migration
      # of all four packages together (and a check of tiptap, testing-library and router
      # compatibility), not something a bot should propose one package at a time. To migrate,
      # delete these four entries and take the single "react" group pull request.
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      # Keep the Node typings on the Node major the app runs on (see frontend/.nvmrc).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # Stay on the Node major in frontend/.nvmrc; moving it is a deliberate change that also
      # updates .nvmrc, the CI setup and "engines" in package.json.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
