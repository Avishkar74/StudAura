name: CI

# Pull requests run every gate. Pushes to main run the same gates, then scan the images with Trivy
# and publish them to GHCR (see the `publish` job).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: jobs that need more ask for it themselves.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      # The DB tests and the Alembic migration test create throwaway databases on this server.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Type check
        run: mypy .
      - name: Tests (unit, API, database and migrations)
        run: |
          pytest -q -rs | tee pytest.log
          # A skipped test would mean the database was not reached; that must not pass quietly.
          if grep -q "^SKIPPED" pytest.log; then
            echo "::error::Tests were skipped, but the database should be reachable in CI"
            exit 1
          fi

  frontend:
    name: Frontend (eslint, tsc, vitest, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # One source of truth for the Node version: the locked dependencies need >= 24.15.
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  terraform:
    name: Terraform (fmt, validate, test, Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - name: Format
        run: terraform fmt -check -recursive -diff
      # `-backend=false`: no AWS account is needed. `-lockfile=readonly` fails the job if the
      # committed .terraform.lock.hcl is out of date instead of quietly rewriting it.
      - name: Validate (infrastructure)
        run: |
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate
      - name: Validate (state bucket bootstrap)
        working-directory: deploy/terraform/bootstrap
        run: |
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate
      - name: Plan tests (provider mocked, no credentials)
        run: terraform test
      # Misconfigurations rated HIGH or CRITICAL fail the job. Accepted risks are annotated in the
      # code with `#trivy:ignore` and a reason (docs/CICD.md).
      - name: Trivy misconfiguration scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: deploy/terraform
          skip-dirs: deploy/terraform/tests
          severity: HIGH,CRITICAL
          exit-code: "1"
          hide-progress: true

  helm:
    name: Helm (lint, template, Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HELM_VERSION: v4.3.1
      HELM_SHA256: 0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Helm
        run: |
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" -o helm.tgz
          echo "${HELM_SHA256}  helm.tgz" | sha256sum -c -
          # Extract elsewhere: the checkout has a helm/ directory that the binary would collide with.
          mkdir "$RUNNER_TEMP/helm-bin"
          tar -xzf helm.tgz -C "$RUNNER_TEMP/helm-bin" --strip-components=1 linux-amd64/helm
          sudo install "$RUNNER_TEMP/helm-bin/helm" /usr/local/bin/helm
          rm helm.tgz
      - name: Lint
        run: helm lint helm/studaura --strict --set image.tag=${{ github.sha }}
      - name: The chart refuses to render without an image tag
        run: |
          if helm template studaura helm/studaura >/dev/null 2>&1; then
            echo "::error::The chart rendered without image.tag"
            exit 1
          fi
      - name: Render
        run: |
          mkdir -p "$RUNNER_TEMP/rendered"
          helm template studaura helm/studaura -n studaura --set image.tag=${{ github.sha }} > "$RUNNER_TEMP/rendered/studaura.yaml"
      - name: Trivy misconfiguration scan of the rendered manifests
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ runner.temp }}/rendered
          severity: HIGH,CRITICAL
          exit-code: "1"
          hide-progress: true

  images:
    name: "Image (${{ matrix.image }}): build and smoke test"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.image }}
          # The backend Dockerfile ends with a dev stage, so the runtime stage is named here.
          target: ${{ matrix.image == 'backend' && 'runtime' || 'prod' }}
          load: true
          push: false
          tags: studaura-${{ matrix.image }}:ci
          # Placeholders: this image only has to build and serve here. Real values are used by
          # the publish job.
          build-args: |
            VITE_SUPABASE_URL=https://placeholder.supabase.co
            VITE_SUPABASE_ANON_KEY=placeholder-anon-key
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
      - name: Runs as a non-root user
        run: |
          uid="$(docker run --rm --entrypoint id studaura-${{ matrix.image }}:ci -u)"
          echo "uid=$uid"
          test "$uid" != "0"
      - name: Smoke test (backend)
        if: matrix.image == 'backend'
        run: |
          # /health must not need the database, so none is running here.
          docker run -d --name smoke -p 8000:8000 -e APP_ENV=test studaura-backend:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/health && break
            sleep 1
          done
          curl -fsS http://localhost:8000/health | grep -q '"ok"'
          curl -fsS http://localhost:8000/metrics | grep -q 'app_'
          # Readiness must report the missing database instead of pretending to be ready.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/ready)" = "503"
      - name: Smoke test (frontend)
        if: matrix.image == 'frontend'
        run: |
          docker run -d --name smoke -p 8080:8080 studaura-frontend:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/healthz && break
            sleep 1
          done
          curl -fsS http://localhost:8080/ | grep -q 'id="root"'
          # A deep link falls back to the single-page app.
          curl -fsS http://localhost:8080/learn/some/deep/link | grep -q 'id="root"'
          # The security headers must reach the page and the assets, not just the server block.
          for path in / /learn/some/deep/link; do
            headers="$(curl -fsS -D - -o /dev/null "http://localhost:8080$path")"
            echo "$headers" | grep -qi '^x-content-type-options: nosniff'
            echo "$headers" | grep -qi '^x-frame-options: DENY'
            echo "$headers" | grep -qi '^referrer-policy: strict-origin-when-cross-origin'
          done
      - name: Container logs
        if: failure()
        run: docker logs smoke || true

  publish:
    name: "Publish (${{ matrix.image }}): scan with Trivy, push to GHCR"
    # Only pushes to main publish. Pull requests never get package-write access.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, images]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image name
        id: name
        # GHCR names must be lower case; the owner may not be.
        run: echo "repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/studaura-${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image (not pushed yet)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.image }}
          target: ${{ matrix.image == 'backend' && 'runtime' || 'prod' }}
          load: true
          push: false
          tags: ${{ steps.name.outputs.repo }}:${{ github.sha }}
          # Public values (the Supabase anon key is meant for browsers). Set them under
          # Settings > Secrets and variables > Actions > Variables.
          build-args: |
            VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ vars.VITE_SUPABASE_ANON_KEY }}
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
          cache-from: type=gha,scope=${{ matrix.image }}
      # Policy: CRITICAL vulnerabilities that have a fix block publishing. HIGH and below are
      # reported in the artifacts and reviewed, but do not block (docs/CICD.md).
      - name: Trivy report (machine-readable, all severities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.name.outputs.repo }}:${{ github.sha }}
          format: json
          output: trivy-${{ matrix.image }}.json
          exit-code: "0"
      - name: Trivy report (human-readable, HIGH and CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.name.outputs.repo }}:${{ github.sha }}
          format: table
          output: trivy-${{ matrix.image }}.txt
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - name: Trivy gate (fails on fixable CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.name.outputs.repo }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Keep the Trivy reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-${{ matrix.image }}
          path: |
            trivy-${{ matrix.image }}.json
            trivy-${{ matrix.image }}.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push (commit SHA tag, and latest)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.image }}
          target: ${{ matrix.image == 'backend' && 'runtime' || 'prod' }}
          push: true
          tags: |
            ${{ steps.name.outputs.repo }}:${{ github.sha }}
            ${{ steps.name.outputs.repo }}:latest
          build-args: |
            VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ vars.VITE_SUPABASE_ANON_KEY }}
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
          cache-from: type=gha,scope=${{ matrix.image }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Summary
        run: |
          {
            echo "### ${{ matrix.image }}"
            echo "Pushed \`${{ steps.name.outputs.repo }}:${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
