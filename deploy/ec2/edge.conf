# nginx config for the `web` container: the SPA, plus a reverse proxy to the backend so the
# browser sees one origin (no CORS, and the frontend is built with an empty API base URL).
server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  # Notes are at most 100 KB; nothing the API accepts is larger than this.
  client_max_body_size 1m;

  # nginx drops server-level headers in any location that sets its own add_header, so they are
  # repeated in each location that serves content.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location = /healthz {
    access_log off;
    return 200 'ok';
    add_header Content-Type text/plain;
  }

  # The API. The URI is passed through untouched (the backend's routes start with /api/v1).
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Imports call YouTube (5 s per request, a few requests per page).
    proxy_read_timeout 60s;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;
  }

  # Liveness and readiness, for smoke tests and uptime checks.
  location = /health {
    proxy_pass http://backend:8000;
    add_header Cache-Control "no-store" always;
  }
  location = /ready {
    proxy_pass http://backend:8000;
    add_header Cache-Control "no-store" always;
  }

  # Metrics are for the monitoring stack on the private network, not the internet.
  location = /metrics {
    return 404;
  }

  location /assets/ {
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
