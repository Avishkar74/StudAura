{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "studaura.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host | quote }}
      {{- end }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-backend
                port: { name: http }
          # Probe endpoints, handy for checking the deployment through the load balancer.
          - path: /health
            pathType: Exact
            backend:
              service:
                name: {{ .Release.Name }}-backend
                port: { name: http }
          - path: /ready
            pathType: Exact
            backend:
              service:
                name: {{ .Release.Name }}-backend
                port: { name: http }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-frontend
                port: { name: http }
{{- end }}
